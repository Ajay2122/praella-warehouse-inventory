server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the api service by its docker-compose service name, so the
    # built client talks to /api exactly like the Vite dev server's proxy
    # does - no API base URL needs to be baked into the build.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any non-file route resolves to index.html so React
    # Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
